name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  shell-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Collect shell files
        id: files
        shell: bash
        run: |
          set -eu

          tmpfile="$(mktemp)"

          git ls-files | while IFS= read -r f; do
            [ -f "$f" ] || continue

            case "$f" in
              *.sh|*/init.d/*|*/uci-defaults/*|*/hotplug.d/*)
                printf '%s\n' "$f" >> "$tmpfile"
                continue
                ;;
            esac

            if head -n 1 "$f" 2>/dev/null | grep -Eq '^#!.*\b(sh|ash|bash)\b'; then
              printf '%s\n' "$f" >> "$tmpfile"
            fi
          done

          sort -u "$tmpfile" > shell-files.txt
          rm -f "$tmpfile"

          if [ -s shell-files.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Shell files:"
            cat shell-files.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No shell files found."
          fi

      - name: Run shfmt
        if: steps.files.outputs.found == 'true'
        shell: bash
        run: |
          set -eu
          xargs -r shfmt -d -ci < shell-files.txt

      - name: Run ShellCheck
        if: steps.files.outputs.found == 'true'
        shell: bash
        run: |
          set -eu
          xargs -r shellcheck -x -S warning < shell-files.txt

      - name: Run tests
        shell: bash
        run: ./tests/run.sh
